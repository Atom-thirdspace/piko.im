[project]
name = "piko-cli"
version = "0.1.0"
description = "Work on Piko problems from your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [
    { name = "Aryan Brite" },
    { name = "Adhdhyan Jain" },
    { name = "Pranjal" },
]
keywords = ["piko", "competitive-programming", "dsa", "judge", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://piko.aryan.my"
Source = "https://github.com/Atom-thirdspace/piko.im"
Issues = "https://github.com/Atom-thirdspace/piko.im/issues"

[project.scripts]
piko = "piko_cli.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["piko_cli", "piko_cli.tui"]
