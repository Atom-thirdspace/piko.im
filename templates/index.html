{% extends "base-login.html" %}

{% block head %}

{% block content %}
<main>
    <a data-aos="fade-in" id="log" href="{{ url_for('auth.login_page') }}">

</header>
<div class="hero">
<section id="section2" aria-label="DSA learning gallery">
  <div id="companies">

        </div>

        <div class="masonry-row">
          <div class="gallery-tile gallery-tall">

              alt=""
            >
          </div>
        </div>

        <div class="masonry-row">
          <div class="gallery-tile gallery-tall">
            <img
              src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=900&q=82"

</section>

    <h1>
        <span data-aos="fade-up" data-aos-delay="200" class="highlight3">
            Finally, DSA
        </span>
    </h1>
    <h1 data-aos="fade-up" data-aos-delay="400" class="highlight1 line2">
        <span>
            that
        </span>
    </h1>

    <h1>
    <span data-aos="fade-up" data-aos-delay="600" class="highlight line3">
        feels Gamified

        <svg class="pencil-line" viewBox="0 0 1000 30" preserveAspectRatio="none">
            <defs>
                <filter id="rough">
                    <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0.03"
                        numOctaves="2"
                        seed="3"
                        result="noise"
                    />
                    <feDisplacementMap
                        in="SourceGraphic"
                        in2="noise"
                        scale="2"
                    />
                </filter>
            </defs>

            <path d="M 5 20
                     C 180 8, 350 10, 520 9
                     C 700 8, 860 10, 995 17" />
        </svg>
    </span>

    <span class="highlight4">.</span>
</h1>

{% block js %}
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  const galleryTrack = document.querySelector("#companies .track");
  if (galleryTrack && galleryTrack.children.length === 2) {
    const thirdGallerySet = galleryTrack.children[0].cloneNode(true);
    thirdGallerySet.setAttribute("aria-hidden", "true");
    galleryTrack.appendChild(thirdGallerySet);
  }
  AOS.init();
</script>
{% endblock js %}
