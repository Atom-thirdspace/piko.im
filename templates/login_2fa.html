{% extends "base-login.html" %}

{% block content %}
  <main class="gate">
    <h1>Two-factor code</h1>
    <p class="gate__sub">
      Open your authenticator app and enter the six-digit code for Piko.
      A backup code works here too.
    </p>

    {% if error %}
      <p class="gate__error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post">
      {{ csrf_field() }}
      <input class="gate__input" type="text" name="code" inputmode="numeric"
             autocomplete="one-time-code" placeholder="123 456" autofocus required>
      <button type="submit">Verify</button>
    </form>

    <p class="gate__foot">
      <a href="{{ url_for('auth.login_page') }}">Start again</a>
    </p>
  </main>
{% endblock content %}
