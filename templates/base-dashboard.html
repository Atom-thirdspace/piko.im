{% extends "base.html" %}

{% block body_before_content %}
  <nav class="topnav">
    <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
    <a href="{{ url_for('profile.me') }}">Profile</a>
    <a href="{{ url_for('profile.settings') }}">Settings</a>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <button type="submit" class="settings-link">Log out</button>
    </form>
  </nav>
  {% set viewer = current_user() %}
  {% if viewer and not viewer.email_verified %}
    <div class="verify-banner">
      <span>Confirm your email ({{ viewer.email }}) so we can reach you about your account.</span>
      <form method="post" action="{{ url_for('accounts.resend_verification') }}">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <button type="submit" class="settings-link">Resend the link</button>
      </form>
    </div>
  {% endif %}
{% endblock body_before_content %}
